<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>様式8-2｜臨床研究申請書（探索研究IRB用）</title>
<style>
:root{
  --line:#111;
  --thin:#444;
  --paper:#fff;
  --bg:#e9edf3;
  --text:#111;
  --sub:#555;
  --accent:#1a5c96;
  --warn:#b00020;
  --sheet:#ffffff;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Yu Gothic","Meiryo",sans-serif;
  background:var(--bg);
  color:var(--text);
}
.wrap{max-width:1580px;margin:0 auto;padding:14px;}
.topbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:14px;
}
.topbar a,.topbar button{
  border:none;
  border-radius:8px;
  padding:10px 14px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  text-decoration:none;
  background:#1a5c96;
  color:#fff;
}
.topbar .secondary{
  background:#fff;
  color:#1a5c96;
  border:1px solid #1a5c96;
}
.layout{
  display:grid;
  grid-template-columns:390px 1fr;
  gap:16px;
  align-items:start;
}
.panel{
  background:#fff;
  border-radius:10px;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
  padding:16px;
  position:sticky;
  top:14px;
  max-height:calc(100vh - 28px);
  overflow:auto;
}
.panel h2{font-size:18px;margin:0 0 10px;color:#1a5c96;}
.panel h3{
  font-size:13px;
  color:#1a5c96;
  margin:14px 0 8px;
  padding-bottom:4px;
  border-bottom:1px solid #d9e4f0;
}
label{display:block;font-size:12px;font-weight:700;margin:7px 0 4px;}
input[type="text"], textarea, select{
  width:100%;
  border:1px solid #c9d2dd;
  border-radius:5px;
  padding:7px 9px;
  font-size:12px;
  font-family:inherit;
  background:#fff;
}
textarea{min-height:56px;resize:vertical;line-height:1.5;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.small{font-size:11px;color:#666;line-height:1.5;}
.check-grid label{font-weight:400;margin:4px 0;}
.preview-area{
  display:flex;
  flex-direction:column;
  gap:18px;
  align-items:center;
  min-width:0;
  overflow:auto;
}
.page{
  width:210mm;
  min-height:297mm;
  margin:0 auto;
  background:var(--sheet);
  box-shadow:0 2px 16px rgba(0,0,0,.12);
  padding:7mm 8mm 8mm;
  color:#000;
  position:relative;
  page-break-after:always;
  break-after:page;
}
.page-inner{
  border:1.6px solid #111;
  padding:3.2mm 3.6mm 4mm;
  min-height:calc(297mm - 15mm);
  height:calc(297mm - 15mm);
  background:#fff;
  display:flex;
  flex-direction:column;
}
.doc-head{
  font-family:"MS Mincho","Yu Mincho","Hiragino Mincho ProN",serif;
  font-size:10px;
  line-height:1.15;
  margin-bottom:1.5mm;
}
.doc-head .date-row{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:flex-end;
}
.doc-head .center-note{flex:1;text-align:center;}
.doc-title{
  text-align:center;
  font-family:"MS Mincho","Yu Mincho","Hiragino Mincho ProN",serif;
  font-size:17px;
  font-weight:700;
  line-height:1.25;
  margin:1mm 0 1.5mm;
  letter-spacing:.04em;
}
.note-red{
  color:var(--warn);
  font-family:"MS Mincho","Yu Mincho","Hiragino Mincho ProN",serif;
  font-size:10px;
  line-height:1.35;
  margin-bottom:1mm;
}
.page-no{
  font-family:"MS Mincho","Yu Mincho","Hiragino Mincho ProN",serif;
  font-size:10px;
  text-align:right;
  margin-bottom:1mm;
}
.page-body{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
}
table.form{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
  font-family:"MS Mincho","Yu Mincho","Hiragino Mincho ProN",serif;
  font-size:10.5px;
  line-height:1.25;
  margin:0;
}
table.form th, table.form td{
  border:1.35px solid var(--line);
  padding:3px 5px;
  vertical-align:top;
  word-break:break-word;
}
table.form th{text-align:left;font-weight:700;background:#fff;}
table.form.form-fill{
  height:100%;
}
table.form.form-fill tbody{
  height:100%;
}
table.form.form-fill tr.row-flex{
  height:1%;
}
table.form.form-fill td.fill, 
table.form.form-fill th.fill{
  height:100%;
}
.dense{line-height:1.18;}
.tiny{font-size:9.2px;line-height:1.24;}
.mini{font-size:8.6px;line-height:1.16;}
.cell-lines{white-space:pre-wrap;line-height:1.18;}
.checkline{display:block;margin:0 0 1px;}
.indent{padding-left:1em;}
.compact-note{line-height:.98;margin-top:0;margin-bottom:0;}
.subblock{margin-top:4px;font-weight:700;}
.a4-fit td, .a4-fit th{
  overflow:hidden;
}
@page{size:A4;margin:0;}
@media (max-width:1300px){
  .layout{grid-template-columns:1fr;}
  .panel{position:static;max-height:none;}
  .page{width:100%;min-height:auto;}
  .page-inner{min-height:auto;height:auto;}
}
@media print{
  html,body{background:#fff;}
  body{margin:0;}
  .topbar,.panel{display:none!important;}
  .wrap{max-width:none;padding:0;}
  .preview-area{gap:0;overflow:visible;}
  .page{
    box-shadow:none;
    margin:0;
    width:210mm;
    height:297mm;
    padding:3.5mm 4.5mm 3.5mm;
    box-sizing:border-box;
  }
  .page-inner{
    min-height:calc(297mm - 7mm);
    height:calc(297mm - 7mm);
  }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a href="index.html" class="secondary">← index.html に戻る</a>
    <button type="button" onclick="updatePreview()">プレビュー更新</button>
    <button type="button" onclick="clearFormAll()">入力内容をすべてクリア</button>
    <button type="button" class="secondary" onclick="window.print()">印刷 / PDF保存</button>
  </div>

  <div class="layout">
    <div class="panel">
      <h2>様式8-2 入力</h2>

      <h3>基本情報</h3>
      <div class="grid2">
        <div><label for="docDate">作成日</label><input type="text" id="docDate" placeholder="2026年5月20日"></div>
        <div><label for="pageInfo">ページ表記</label><input type="text" id="pageInfo" value=""></div>
      </div>

      <label for="theme">1.研究課題名</label><input type="text" id="theme">
      <label for="secretTitle">秘密保持のための課題名</label><input type="text" id="secretTitle">

      <h3>2.研究組織の分類</h3>
      <div class="check-grid">
        <label><input type="checkbox" id="org_single"> 単独施設による研究</label>
        <label><input type="checkbox" id="org_lead"> 多施設共同研究の主任研究者</label>
        <label><input type="checkbox" id="org_participate"> 多施設共同研究への参加</label>
        <label for="leadSite">主任施設名</label><input type="text" id="leadSite">
        <label><input type="checkbox" id="approval_yes"> 他施設の倫理委員会による承認証明書あり</label>
        <label><input type="checkbox" id="approval_no"> 他施設の倫理委員会による承認証明書なし</label>
        <label><input type="checkbox" id="office_yes"> 研究事務局の請負あり</label>
        <label><input type="checkbox" id="office_no"> 研究事務局の請負なし</label>
        <label><input type="checkbox" id="org_student"> 大学院の学生としての研究</label>
        <label for="orgOther">その他</label><input type="text" id="orgOther">
      </div>

      <h3>3.研究の分類・適応指針</h3>
      <div class="check-grid">
        <label><input type="checkbox" id="guide_life"> 人を対象とする生命科学・医学系研究</label>
        <label><input type="checkbox" id="invasion_yes"> 侵襲あり</label>
        <label><input type="checkbox" id="invasion_no"> 侵襲なし</label>
        <label><input type="checkbox" id="minor_yes"> 侵襲の度合いは軽微</label>
        <label><input type="checkbox" id="minor_no"> 侵襲の度合いは軽微でない</label>
        <label><input type="checkbox" id="medical_over_no"> 通常診療を超える医療行為なし</label>
        <label><input type="checkbox" id="medical_over_yes"> 通常診療を超える医療行為あり</label>
        <label><input type="checkbox" id="intervention_yes"> 介入あり</label>
        <label><input type="checkbox" id="intervention_no"> 介入なし</label>
        <label><input type="checkbox" id="specimen_yes"> 人体から取得する試料を用いる</label>
        <label><input type="checkbox" id="specimen_no"> 人体から取得する試料を用いない</label>
        <label><input type="checkbox" id="biobank_yes"> バイオバンク室保存検体を使用する</label>
        <label><input type="checkbox" id="biobank_no"> バイオバンク室保存検体を使用しない</label>
        <label for="otherGuide">上記以外の研究（適応される倫理指針等）</label><input type="text" id="otherGuide">
      </div>

      <h3>4〜10</h3>
      <label for="place">4.研究機関名・研究実施場所</label><input type="text" id="place" value="静岡がんセンター">
      <label for="responsibleName">5.研究実施責任者氏名</label><input type="text" id="responsibleName">
      <label for="researchers">6.研究者氏名</label><textarea id="researchers"></textarea>

      <label for="collab">7.共同研究機関（代表研究者名とその役割）</label><textarea id="collab"></textarea>
      <label for="purposeSummary">8.研究の意義・目的の概略</label><textarea id="purposeSummary"></textarea>
      <div class="grid2">
        <div><label for="subjectCount">9(1).被験者数</label><input type="text" id="subjectCount"></div>
        <div><label for="selectionPolicy">9(2).被験者の選定方針</label><textarea id="selectionPolicy"></textarea></div>
      </div>
      <label for="methodSummary">10(1).研究方法 概略</label><textarea id="methodSummary"></textarea>
      <label for="evaluationItems">10(2).評価項目</label><textarea id="evaluationItems"></textarea>

      <h3>11.実施予定期間</h3>
      <label><input type="checkbox" id="period_start_approval"> 開始：承認日より</label>
      <label><input type="checkbox" id="period_start_date_check"> 開始：年月日より（承認日より後の場合）</label>
      <input type="text" id="period_start_date">
      <label><input type="checkbox" id="period_end_year_check"> 終了：年12月31日まで</label>
      <input type="text" id="period_end_year">

      <h3>12.利益・不利益</h3>
      <label><input type="checkbox" id="benefit_none_check"> 直接的な利益は期待できない</label>
      <label><input type="checkbox" id="benefit_yes_check"> 直接的な利益が期待できる</label>
      <input type="text" id="benefit_yes_text" placeholder="具体的に">
      <label><input type="checkbox" id="risk_yes_check"> 負担やリスクあり</label>
      <input type="text" id="risk_yes_text" placeholder="具体的に">
      <label><input type="checkbox" id="risk_normal_no"> 通常の診療範囲内であり、負担やリスクはない</label>
      <label><input type="checkbox" id="risk_unrelated_no"> 診療には関係なく、負担やリスクはない</label>
      <label><input type="checkbox" id="risk_other_check"> その他</label>
      <input type="text" id="risk_other_text">
      <label for="riskMin">(3)最小化対策</label><textarea id="riskMin"></textarea>

      <h3>13.保存・廃棄</h3>
      <label><input type="checkbox" id="store_during_sc"> 研究期間中：静岡がんセンター内で保存する</label>
      <label><input type="checkbox" id="store_during_collab"> 研究期間中：共同研究機関で保存する</label>
      <label><input type="checkbox" id="store_during_both"> 研究期間中：静岡がんセンター内で保存し、かつ共同研究機関で保存する</label>
      <label><input type="checkbox" id="store_during_registry"> 研究期間中：静岡がんセンター内で保存し、かつ学会登録</label>
      <label><input type="checkbox" id="manager_sc"> 保存管理責任者：静岡がんセンターの研究実施責任者</label>
      <label><input type="checkbox" id="manager_other"> 保存管理責任者：①以外の研究者が管理する</label>
      <div class="grid2">
        <div><label for="managerAff">所属</label><input type="text" id="managerAff"></div>
        <div><label for="managerTitle">職名</label><input type="text" id="managerTitle"></div>
      </div>
      <label for="managerName">氏名</label><input type="text" id="managerName">
      <label><input type="checkbox" id="save_blood"> 研究終了後：血液・組織等の保存</label><input type="text" id="save_blood_until" placeholder="保存期間 年12月31日まで">
      <label><input type="checkbox" id="save_data"> 研究終了後：データの保存（対応表を含む）</label><input type="text" id="save_data_until" placeholder="保存期間 年12月31日まで">
      <label><input type="checkbox" id="save_other_check"> 研究終了後：その他</label><input type="text" id="save_other_text">
      <label><input type="checkbox" id="after_place_sc"> 保存の場所と保存管理責任者：静岡がんセンター内で保存する</label>
      <input type="text" id="after_place_sc_place" placeholder="場所">
      <input type="text" id="after_place_sc_person" placeholder="所属・職名・氏名">
      <label><input type="checkbox" id="after_place_collab"> 保存の場所と保存管理責任者：共同研究機関で保存する</label>
      <input type="text" id="after_place_collab_place" placeholder="場所">
      <input type="text" id="after_place_collab_person1" placeholder="共同研究機関：所属・職名・氏名">
      <input type="text" id="after_place_collab_person2" placeholder="静岡がんセンター：所属・職名・氏名">
      <label><input type="checkbox" id="dispose_sealed"> 廃棄：密封容器に廃棄</label>
      <label><input type="checkbox" id="dispose_burn"> 廃棄：焼却処分</label>
      <label><input type="checkbox" id="dispose_shred"> 廃棄：紙はシュレッダー、電子データは完全消去</label>
      <label><input type="checkbox" id="dispose_other_check"> 廃棄：その他</label><input type="text" id="dispose_other_text">

      <h3>14.個人情報の取扱い</h3>
      <label><input type="checkbox" id="pi_anonymous"> 匿名加工情報を使用</label>
      <label><input type="checkbox" id="pi_pseudo_ident_yes"> 仮名加工情報を使用（情報取扱主体で個人識別性が「有」）</label>
      <label><input type="checkbox" id="pi_pseudo_keep_source"> 元となる個人情報を保有する場合</label>
      <label><input type="checkbox" id="pi_pseudo_keep_restore"> 元となる個人情報は保有しない、個人情報を復元できる情報を保有する場合</label>
      <label><input type="checkbox" id="pi_pseudo_ident_no"> 仮名加工情報を使用（情報取扱主体で個人識別性が「無」）</label>
      <label><input type="checkbox" id="pi_related"> 個人関連情報を使用（情報取扱主体で個人識別性が「無」）</label>
      <label><input type="checkbox" id="pi_personal"> 個人情報を使用（情報取扱主体で個人識別性が「有」）</label>
      <label><input type="checkbox" id="pi_personal_keep_source"> 元となる個人情報を保有する場合</label>
      <label><input type="checkbox" id="pi_personal_keep_restore"> 元となる個人情報は保有しない、個人情報を復元できる情報を保有する場合</label>
      <label for="pi_process">①加工情報について／具体的な加工の方法</label><textarea id="pi_process"></textarea>
      <label><input type="checkbox" id="pi_manager_specimen"> 個人情報管理者：検体を伴う研究の場合</label>
      <input type="text" id="pi_manager_room_head" placeholder="個人情報管理室長 〇〇 〇〇">
      <label><input type="checkbox" id="pi_manager_nonspecimen"> 個人情報管理者：検体を伴わない研究の場合</label>
      <div class="grid2">
        <div><label for="pi_manager_aff">所属</label><input type="text" id="pi_manager_aff"></div>
        <div><label for="pi_manager_title">職名</label><input type="text" id="pi_manager_title"></div>
      </div>
      <label for="pi_manager_name">氏名</label><input type="text" id="pi_manager_name" placeholder="科部長が個人情報管理者">
      <label><input type="checkbox" id="pi_store_server"> 作成元個人情報の管理方法：電子カルテ系ファイルサーバ内のフォルダに保管する</label>
      <label><input type="checkbox" id="pi_store_isolated"> 他と切り離されたコンピュータを使用し、外部記憶媒体に記録させ、その記憶媒体は鍵をかけて厳重に保管する</label>
      <label><input type="checkbox" id="pi_store_room"> 個人情報管理室で管理する</label>
      <label><input type="checkbox" id="pi_store_other_check"> その他</label><input type="text" id="pi_store_other">
      <label><input type="checkbox" id="pi_place_sc"> 作成元個人情報の保管場所：静岡がんセンター内</label><input type="text" id="pi_place_sc_text" placeholder="場所">
      <label><input type="checkbox" id="pi_place_other_check"> 作成元個人情報の保管場所：その他</label><input type="text" id="pi_place_other" placeholder="場所">

      <div class="small">※ 15〜30の入力欄は元コードと同じIDのまま、下にそのまま続けてください。</div>
    </div>

    <div class="preview-area" id="previewArea"></div>
  </div>
</div>

<script>
function getVal(id){ const el=document.getElementById(id); return el ? el.value.trim() : ''; }
function isChecked(id){ const el=document.getElementById(id); return !!(el && el.checked); }
function mark(id){ return isChecked(id) ? '■' : '□'; }
function textOr(id, fallback=''){ const v=getVal(id); return v || fallback; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function nlHtml(s){ return (s||'').replace(/\n/g,'<br>'); }

function buildPage(pageNo,total,bodyHtml,showTitle=false){
  return `
  <div class="page">
    <div class="page-inner">
      <div class="doc-head">
        <div class="date-row">
          <div>様式８－２　${esc(textOr('docDate','　　　年　　月　　日'))}</div>
          <div class="center-note">年月日を必ず記入してください。バージョン管理に用います。</div>
        </div>
      </div>
      <div class="page-no">様式 承認日 2022年8月22日　ページ ${pageNo}／全${total}ページ</div>
      ${showTitle ? '<div class="doc-title">臨床研究申請書（探索研究IRB用）</div><div class="note-red">注1）記載はすべて、MS明朝、10ポで統一してください。注2）本様式作成時は青字部分を全て削除してください。</div>' : ''}
      <div class="page-body">${bodyHtml}</div>
    </div>
  </div>`;
}

function renderPreview(){
  const pages = [];

  pages.push(buildPage(1, 15, `
    <table class="form form-fill a4-fit">
      <colgroup><col style="width:20%"><col style="width:80%"></colgroup>
      <tbody>
        <tr class="row-flex"><th>1.研究課題名</th><td>${esc(textOr('theme','未入力'))}<div class="tiny">必要なら秘密保持のための課題名を記載：${esc(textOr('secretTitle',''))}</div></td></tr>
        <tr class="row-flex"><th>2.研究組織の分類</th><td class="dense">${mark('org_single')} 単独施設による研究<br>${mark('org_lead')} 多施設共同研究の主任研究者<br>${mark('org_participate')} 多施設共同研究への参加（主任施設名：${esc(textOr('leadSite',''))}）<br>他施設の倫理委員会による承認証明書：${mark('approval_yes')}あり　${mark('approval_no')}なし<br>研究事務局の請負：${mark('office_yes')}あり　${mark('office_no')}なし<br>${mark('org_student')} 大学院の学生としての研究<br>□ その他（${esc(textOr('orgOther',''))}）</td></tr>

ce_other',''))} ）</span></td></tr>

function clearFormAll(){
  document.querySelectorAll('input, textarea, select').forEach(el=>{
    if(el.type === 'checkbox') el.checked = false;
    else if(el.id === 'place') el.value = '静岡がんセンター';
    else el.value = '';
  });
  renderPreview();
}

function updatePreview(){ renderPreview(); }

document.querySelectorAll('input, textarea, select').forEach(el=>{
  el.addEventListener('input', updatePreview);
  el.addEventListener('change', updatePreview);
});

renderPreview();
</script>
