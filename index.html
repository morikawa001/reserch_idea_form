<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>title</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="icon"></div>
    <div>
      <h1>h1</h1>
      <p>p</p>
    </div>
  </header>

  <!-- Progress steps -->
  <div class="progress-wrap">
    <div class="steps">
      <div class="step-item active" id="step-nav-1" onclick="goToStep(1)">
        <div class="step-num">1</div>
        <div class="step-label"></div>
      </div>
      <div class="step-item" id="step-nav-2" onclick="goToStep(2)">
        <div class="step-num">2</div>
        <div class="step-label"></div>
      </div>
      <div class="step-item" id="step-nav-3" onclick="goToStep(3)">
        <div class="step-num">3</div>
        <div class="step-label"></div>
      </div>
      <div class="step-item" id="step-nav-4" onclick="goToStep(4)">
        <div class="step-num">4</div>
        <div class="step-label"></div>
      </div>
      <div class="step-item" id="step-nav-5" onclick="goToStep(5)">
        <div class="step-num">5</div>
        <div class="step-label"></div>
      </div>
      <div class="step-item" id="step-nav-6" onclick="goToStep(6)">
        <div class="step-num">6</div>
        <div class="step-label"></div>
      </div>
      <div class="step-item" id="step-nav-7" onclick="goToStep(7)">
        <div class="step-num">7</div>
        <div class="step-label"></div>
      </div>
      <div class="step-item" id="step-nav-8" onclick="goToStep(8)">
        <div class="step-num">8</div>
        <div class="step-label">AI</div>
      </div>
    </div>
  </div>

  <div class="main">
    <!-- STEP 1 -->
    <div class="tab-panel active" id="panel-1">
      <div class="card">
        <h2>h2</h2>
        <div class="info-box"></div>

        <label class="field-label">
          <span class="req">*</span>
        </label>
        <input type="text" id="theme" placeholder="">

        <label class="field-label"></label>
        <textarea id="background" placeholder=""></textarea>

        <label class="field-label">PICO/PECO</label>
        <textarea id="purpose" placeholder="P / I / C / O"></textarea>

        <label class="field-label"></label>
        <select id="design">
          <option value=""></option>
          <option value="Cross-sectional study">Cross-sectional study</option>
          <option value=""></option>
          <option value=""></option>
          <option value="RCT">RCT</option>
          <option value=""></option>
          <option value=""></option>
          <option value="Mixed Methods">Mixed Methods</option>
          <option value=""></option>
          <option value=""></option>
        </select>

        <label class="field-label"></label>
        <input type="text" id="disease" placeholder="">

        <label class="field-label"></label>
        <input type="text" id="subjects" placeholder="">

        <label class="field-label"></label>
        <input type="text" id="setting" placeholder="ICU">
      </div>

      <div class="card">
        <h2>h2</h2>

        <label class="field-label"></label>
        <div class="radio-group">
          <label><input type="radio" name="intervention" value="yes">yes</label>
          <label><input type="radio" name="intervention" value="no">no</label>
        </div>

        <label class="field-label"></label>
        <div class="radio-group">
          <label><input type="radio" name="unapproved" value="yes">yes</label>
          <label><input type="radio" name="unapproved" value="no">no</label>
          <label><input type="radio" name="unapproved" value="na">NA</label>
        </div>

        <label class="field-label"></label>
        <div class="radio-group">
          <label><input type="radio" name="funding" value="yes">yes</label>
          <label><input type="radio" name="funding" value="no">no</label>
        </div>

        <label class="field-label"></label>
        <div class="radio-group">
          <label><input type="radio" name="clinicalTrial" value="yes">yes</label>
          <label><input type="radio" name="clinicalTrial" value="no">no</label>
        </div>

        <label class="field-label"></label>
        <div class="radio-group">
          <label><input type="radio" name="invasiveness" value="none">none</label>
          <label><input type="radio" name="invasiveness" value="minor">minor</label>
          <label><input type="radio" name="invasiveness" value="major">major</label>
        </div>

        <label class="field-label"></label>
        <div class="radio-group">
          <label><input type="radio" name="multicenter" value="yes">2施設以上</label>
          <label><input type="radio" name="multicenter" value="no">単施設</label>
        </div>

        <label class="field-label"></label>
        <div class="radio-group">
          <label><input type="radio" name="retrospective" value="yes">yes</label>
          <label><input type="radio" name="retrospective" value="no">no</label>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary btn-lg" onclick="goToStep(2)">次へ</button>
      </div>
    </div>

    <!-- STEP 2 -->
    <div class="tab-panel" id="panel-2">
      <div class="card">
        <h2>h2</h2>
        <div id="classification-result-area">
          <div class="info-box">1</div>
          <div id="flowchart-visual" class="flowchart"></div>
          <div id="classification-badge-area" style="margin-top:16px;text-align:center"></div>
          <div id="classification-desc" class="info-box hidden"></div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="goToStep(1)">戻る</button>
        <button class="btn btn-primary btn-lg" onclick="goToStep(3)">次へ</button>
      </div>
    </div>

    <!-- STEP 3 -->
    <div class="tab-panel" id="panel-3">
      <div class="card">
        <h2>h2</h2>
        <div class="info-box"></div>

        <!-- Sub-tabs -->
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;border-bottom:2px solid var(--border)">
          <button class="btn btn-secondary" id="ctab-1" onclick="switchCalcTab(1)" style="border-bottom:3px solid var(--primary);border-radius:6px 6px 0 0;padding:6px 14px;font-size:0.82rem;">t</button>
          <button class="btn btn-secondary" id="ctab-2" onclick="switchCalcTab(2)" style="padding:6px 14px;font-size:0.82rem;">2</button>
          <button class="btn btn-secondary" id="ctab-3" onclick="switchCalcTab(3)" style="padding:6px 14px;font-size:0.82rem;">t</button>
          <button class="btn btn-secondary" id="ctab-4" onclick="switchCalcTab(4)" style="padding:6px 14px;font-size:0.82rem;">感度・特異度</button>
          <button class="btn btn-secondary" id="ctab-5" onclick="switchCalcTab(5)" style="padding:6px 14px;font-size:0.82rem;">1 t</button>
        </div>

        <!-- 以下、元のサンプルサイズ計算パネル群（cpanel-1〜5 と result div）をそのまま配置 -->
        <!-- ここは元ファイルどおりなので省略しますが、実装では完全に貼り付けてください -->

        <!-- ...（c1〜c5 の HTML 全体を元ファイルからそのまま入れてください）... -->

      </div>

      <div class="btn-row">
        <button class="btn btn-secondary" onclick="goToStep(2)">戻る</button>
        <button class="btn btn-primary btn-lg" onclick="goToStep(4)">次へ</button>
      </div>
    </div>

    <!-- STEP 4 SAP -->
    <!-- （SAP 関係の HTML は、元ファイルの panel-4 をそのまま貼り付けてください） -->

    <!-- STEP 5 文献検索 -->
    <!-- （panel-5 も元ファイルのまま） -->

    <!-- STEP 6 必要文書 -->
    <!-- （panel-6 も元ファイルのまま） -->

    <!-- STEP 7 スケジュール（修正部分はここのみ意識） -->
    <div class="tab-panel" id="panel-7">
      <div class="card">
        <h2>h2</h2>
        <div class="info-box">
          倫理審査委員会向けスケジュールを自動計算します。
          「新規様式５提出予定日」を入力してください。
        </div>

        <label class="field-label">
          新規様式５提出予定日
          <span class="req">*</span>
          <span class="hint">IRB 開催日の 7 週間前</span>
        </label>
        <input type="date" id="start-date" oninput="generateSchedule()" style="max-width:200px">

        <div id="schedule-area" style="margin-top:16px"></div>
      </div>

      <div class="btn-row">
        <button class="btn btn-secondary" onclick="goToStep(6)">戻る</button>
        <button class="btn btn-warn btn-lg" onclick="goToStep(8)">AI へ</button>
      </div>
    </div>

    <!-- STEP 8 AI -->
    <!-- （panel-8 は元ファイルをそのまま貼り付け） -->

  </div>

  <div class="end-screen" id="endScreen">
    <div class="end-inner">
      <div class="end-icon"></div>
      <h2 class="end-title"></h2>
      <p class="end-body"><br><br></p>
      <p>
        <button type="button" class="btn-restart" onclick="restartFromEnd()">再開</button>
      </p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
